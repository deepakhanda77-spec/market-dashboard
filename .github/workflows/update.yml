name: Update market data

on:
  schedule:
      - cron: "30 22 * * 1-5"   # 22:30 UTC, Mon-Fri (final data after both India and US close)
      - cron: "15 4-10 * * 1-5"  # hourly during Indian market hours (UTC)
      - cron: "15 14-21 * * 1-5" # hourly during US market hours (UTC)
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch data (stocks only on the daily final run or manual run)
        run: python fetch_yahoo.py --range 2y ${{ (github.event.schedule == '30 22 * * 1-5' || github.event_name == 'workflow_dispatch') && '--stocks' || '' }}
      - name: Commit updated data
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add dashboard.csv intraday.json
          if [ -f stocks.json ]; then git add stocks.json; fi
          git diff --staged --quiet || (git commit -m "Update market data" && git push)
