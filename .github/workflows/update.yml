name: Update market data

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, Mon-Fri (after both India and US close)
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_yahoo.py --range 2y
      - name: Commit updated data
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add dashboard.csv
          git diff --staged --quiet || (git commit -m "Update market data" && git push)
